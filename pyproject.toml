[project]
name = "home"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tsupra", email = "achievement.hunter.tvv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.8",
]

[project.scripts]
home = "home:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]